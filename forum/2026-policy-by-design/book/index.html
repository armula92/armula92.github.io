<button class="nav prev" aria-label="앞 쪽">‹</button><button class="nav next" aria-label="다음 쪽">›</button>
<footer class="bar">
  <span class="hint">← → 키, 쪽 끝을 끌거나 눌러 넘기기</span>
  <input type="range" min="1" max="144" value="1" aria-label="쪽 이동">
  <span class="count"><b>1</b> / 144</span>
  <button class="btn fs" type="button">전체 화면</button>
</footer>
<script src="page-flip-2.0.7.browser.js"></script>
<script>
(() => {
  const N = 144, RATIO = 1240 / 1500;
  const stage = document.getElementById('stage'), el = document.getElementById('book');
  const range = document.querySelector('.bar input'), count = document.querySelector('.count b');
  const toc = document.querySelector('.toc');
  const pages = [...el.querySelectorAll('.pg')];
  // 펼친 면 앞뒤 쪽만 불러온다
  const load = i => { for (let k = Math.max(0, i - 4); k <= Math.min(N - 1, i + 6); k++) {
      const img = pages[k].querySelector('img'); if (img.dataset.src) { img.src = img.dataset.src; delete img.dataset.src; } } };
  // 넓은 화면은 펼침면, 좁은 화면(휴대폰, 세로 창)은 한 쪽. 라이브러리는 책 폭이 최소 쪽 폭의 두 배보다 좁으면 한 쪽으로 보인다
  const isPortrait = () => window.innerWidth <= 760 || (stage.clientWidth - 120) < (stage.clientHeight - 28) * RATIO * 1.3;
  const fit = portrait => {
    const W = stage.clientWidth - (portrait ? 16 : 120), Hh = stage.clientHeight - 28;
    const pw = Math.floor(Math.min(Hh * RATIO, portrait ? W : W / 2));
    el.style.width = (portrait ? pw : pw * 2) + 'px';
    return pw;
  };
  const start = Math.min(N, Math.max(1, parseInt((location.hash.match(/p(\d+)/) || [])[1] || '1', 10))) - 1;
  load(start);
  const portrait = isPortrait();
  const pw = fit(portrait);
  const book = new St.PageFlip(el, {
    width: pw, height: Math.round(pw / RATIO), size: 'stretch', minWidth: portrait ? pw : Math.floor(pw / 2),
    maxWidth: 1400, minHeight: 200, maxHeight: 1800,
    showCover: true, usePortrait: true, mobileScrollSupport: false, flippingTime: 750, maxShadowOpacity: .35,
    startPage: start, autoSize: true, showPageCorners: true, disableFlipByClick: false
  });
  book.loadFromHTML(pages);
  const show = i => { load(i); range.value = i + 1; count.textContent = i + 1;
    history.replaceState(null, '', '#p' + (i + 1)); };
  show(start);
  book.on('flip', e => show(e.data));
  book.on('changeOrientation', () => load(book.getCurrentPageIndex()));
  document.querySelector('.prev').onclick = () => book.flipPrev();
  document.querySelector('.next').onclick = () => book.flipNext();
  range.oninput = () => { const i = range.value - 1; load(i); count.textContent = range.value; };
  range.onchange = () => { const i = range.value - 1; load(i); book.turnToPage(i); show(i); };
  toc.onchange = () => { if (!toc.value) return; const i = toc.value - 1; load(i); book.flip(i); toc.value = ''; };
  document.addEventListener('keydown', e => {
    if (e.target.closest('select, input')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); book.flipNext(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); book.flipPrev(); }
    if (e.key === 'Home') book.turnToPage(0), show(0);
    if (e.key === 'End') book.turnToPage(N - 1), show(N - 1);
  });
  document.querySelector('.fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  // 창 크기가 바뀌면 다시 맞추고, 펼침면과 한 쪽 보기가 바뀌면 그 쪽에서 다시 연다
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => {
    if (isPortrait() !== portrait) return location.reload();
    fit(portrait); book.update(); }, 200); });
})();
</script>
